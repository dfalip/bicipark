<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Bike Battle · BiciPark Play</title><style>
*{box-sizing:border-box}body{background:#142331;color:#fff;font:16px system-ui;margin:0 auto;max-width:900px;padding:16px}canvas{width:100%;height:auto;border:2px solid #9bb7c1;border-radius:12px;display:block}button,select{min-height:44px;padding:8px 16px;font:inherit;border-radius:8px;border:1px solid #91aeb7;background:#244653;color:white}button:disabled{opacity:.45}button:focus-visible,input:focus-visible{outline:3px solid #ffd36a} .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input{max-width:160px}a{color:#c6f5ff}#fire{background:#a84d24}p{line-height:1.5}</style></head>
<body><a href="../">BiciPark</a><h1>Bike Battle</h1><p id="help"></p><label><span id="languageLabel">Idioma</span> <select id="lang"><option value="ca">Català</option><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option></select></label>
<p id="hud" role="status" aria-live="polite"></p><canvas width="800" height="400" id="arena" role="img" aria-label="Bike Battle arena"></canvas>
<div class="controls"><button id="left" aria-label="←">←</button><button id="right" aria-label="→">→</button><label><span id="angleLabel"></span><input id="angle" type="range" min="10" max="85" value="45"><output id="ao">45°</output></label><label><span id="powerLabel"></span><input id="power" type="range" min="10" max="100" value="75"><output id="po">75%</output></label><button id="fire"></button><button id="reset"></button></div>
<script src="engine.js"></script><script src="game.js"></script></body></html>
