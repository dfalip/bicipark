name: ZombiePedal Arcade browser smoke
on:
  pull_request:
    paths:
      - 'zombiepedal/arcade*'
      - 'tools/qa/zombiepedal-arcade-browser.cjs'
      - '.github/workflows/zombiepedal-arcade-browser.yml'
  push:
    branches:
      - main
      - 'feat/zombiepedal-arcade-city-*'
    paths:
      - 'zombiepedal/arcade*'
      - 'tools/qa/zombiepedal-arcade-browser.cjs'
      - '.github/workflows/zombiepedal-arcade-browser.yml'
permissions:
  contents: read
concurrency:
  group: arcade-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arcade-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx --no-install playwright install chromium --with-deps
      - run: node tools/qa/zombiepedal-arcade-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-browser-screenshots
          path: arcade-smoke/
          if-no-files-found: ignore
          retention-days: 7
