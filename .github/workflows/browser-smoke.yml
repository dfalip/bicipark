name: Route Explorer browser smoke
on:
  push:
    branches: [main, 'feat/passage-results-open-route-20261103']
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Optional HTTPS Vercel preview URL (leave blank for local server)'
        required: false
        type: string
      expected_sha:
        description: 'Required for remote preview: exact 40-character Git commit SHA checked out by this run'
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Validate remote preview URL
        if: ${{ inputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          ALLOWED_PREVIEW_HOSTS: ${{ vars.BICIPARK_VERCEL_PREVIEW_HOSTS }}
        run: |
          node - <<'NODE'
          const raw = process.env.ALLOWED_PREVIEW_HOSTS || "";
          const hosts = raw.split(",").map(value => value.trim().toLowerCase()).filter(Boolean);
          if (!hosts.length || hosts.some(host => !/^[-a-z0-9]+\.vercel\.app$/.test(host)) || new Set(hosts).size !== hosts.length) {
            console.error("Configure BICIPARK_VERCEL_PREVIEW_HOSTS with comma-separated exact trusted Vercel hostnames; remote checks fail closed.");
            process.exit(1);
          }
          let url;
          try { url = new URL(process.env.PREVIEW_URL || ""); }
          catch { console.error("Invalid preview URL"); process.exit(1); }
          if (url.protocol !== "https:" || !hosts.includes(url.hostname.toLowerCase()) ||
              url.username || url.password || url.port || url.pathname !== "/" || url.search || url.hash) {
            console.error("Remote preview must use the root HTTPS URL of an explicitly allowed Vercel hostname.");
            process.exit(1);
          }
          NODE
      - name: Confirm checkout SHA for remote preview
        if: ${{ inputs.preview_url != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          node -e 'const expected = process.env.EXPECTED_SHA || ""; const actual = process.env.ACTUAL_SHA || ""; if (!/^[0-9a-f]{40}$/i.test(expected) || expected.toLowerCase() !== actual.toLowerCase()) { console.error(`Remote preview checkout SHA mismatch: expected ${expected || "(missing)"}, actual ${actual}`); process.exit(1); }'
      - name: Serve repository over HTTP
        if: ${{ inputs.preview_url == '' }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bicipark-http.log 2>&1 &
          echo $! > /tmp/bicipark-http.pid
      - name: Check real Leaflet interactions at desktop and mobile widths
        env:
          BICIPARK_BASE_URL: ${{ inputs.preview_url || 'http://127.0.0.1:8765' }}
        run: node tests/browser/route-explorer-smoke.cjs
      - name: Show server log on failure
        if: ${{ failure() && inputs.preview_url == '' }}
        run: cat /tmp/bicipark-http.log || true
