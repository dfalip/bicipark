<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route Watch | BiciPark</title><link rel="stylesheet" href="/modules/route-planner/planner.css"><link rel="stylesheet" href="/css/bicipark-nav.css"><link rel="stylesheet" href="/css/i18n.css"><link rel="stylesheet" href="watch.css"></head>
<body><main><div data-bp-language-switcher></div><p class="eyebrow" data-ride-copy="before">ABANS DE SORTIR</p><h1>Route Watch</h1><p data-ride-copy="watchIntro"></p>
<section class="panel"><label><span data-ride-copy="route"></span><select id="route"></select></label><a href="/modules/route-planner/" data-ride-copy="plan"></a>
